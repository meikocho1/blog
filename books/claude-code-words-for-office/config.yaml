title: "AIが何をしているか分かる本 — 事務職のためのClaude Cowork入門"
summary: |
  プログラミングをしない人が Claude Cowork で安全に作業できるようになるための本です。
  ターミナル（黒い画面）は使いません。

  前半は Claude Desktop のインストールからフォルダの接続、プロジェクトの作り方までの手順。
  後半は承認画面に出てくる言葉（Read/Write、削除保護、プロンプトインジェクション）と、
  作業を止めるべきサインの見分け方をまとめました。

  ゴールは用語を暗記することではなく、AI が「これをしていいですか？」と聞いてきたときに
  「これは安全だから通す」「これは危ないから止める」を自分で判断できるようになることです。
