title: "AIが何をしているか分かる本 — 事務職のためのClaude Cowork / Claude Code 入門"
summary: |
  Claude Cowork や Claude Code を使い始めた非エンジニアのための入門書＋用語集です。

  前半は Claude Desktop のインストールからフォルダの接続、プロジェクトの作り方までの手順。
  後半は画面に出てくるカタカナ語・英語、AI が実行するコマンド、
  そして「Bash(grep -rn ...)」のような表示の読み方を、日本語で1つずつ引けるようにまとめました。

  ゴールは用語を暗記することではなく、AI が許可を求めてきたときに
  「これは安全だから Yes」「これは危ないから一旦止める」を自分で判断できるようになることです。
