title: "黒い画面が読めるようになる本 — Claude Code コマンド・用語辞典"
summary: |
  Claude Code を触ってみて、画面に流れる英語で止まってしまった人のための辞典です。

  「読み物の章」で考え方をつかみ、「全一覧の章」で引く——の2階建て構成。
  Claude Code 自身のコマンドとスラッシュコマンド、AIが実行する Linux コマンド、Git、
  画面表示とツール名、エラー文の逆引き、AI時代の英語用語まで、
  公式ドキュメントを当たって 369 項目を日本語にしました。

  全項目に「🟢見るだけ / 🟡戻せる / 🔴止めて確認」の危険度と、
  専門用語を使わない「一言でいうと」を付けています。

  ※ ターミナルを使わない事務職の方は、姉妹編『AIが何をしているか分かる本』
  （Claude Cowork 編）が向いています。
